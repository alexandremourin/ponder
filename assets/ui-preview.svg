<svg width="940" height="660" viewBox="0 0 940 660" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#1a1a1a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- backdrop -->
  <rect width="940" height="660" fill="#f6f6f7"/>
  <rect x="40" y="30" width="860" height="600" rx="18" fill="#ffffff" filter="url(#shadow)"/>

  <!-- header -->
  <text x="72" y="92" font-size="38" font-weight="800" fill="#1f1f23" letter-spacing="-1">Ponder</text>
  <text x="74" y="120" font-size="15" fill="#6b7280">An agentic RAG that checks its own work — and shows you how.</text>
  <line x1="72" y1="140" x2="868" y2="140" stroke="#ededed" stroke-width="1"/>

  <!-- user question -->
  <rect x="430" y="160" width="438" height="42" rx="12" fill="#f3eddf"/>
  <text x="452" y="187" font-size="14.5" fill="#3f3f46">What are reflection tokens in Self-RAG?</text>

  <!-- reasoning timeline label -->
  <text x="72" y="190" font-size="12.5" font-weight="700" fill="#8a8a8f" letter-spacing="1">REASONING TIMELINE</text>

  <!-- timeline rail -->
  <line x1="86" y1="222" x2="86" y2="470" stroke="#ede5d4" stroke-width="2"/>

  <!-- step rows -->
  <!-- ROUTE -->
  <circle cx="86" cy="232" r="5" fill="#d4a44a"/>
  <rect x="104" y="220" width="62" height="22" rx="6" fill="#f3eddf"/>
  <text x="113" y="235" font-size="11" font-weight="700" fill="#8a6d2f">ROUTE</text>
  <text x="178" y="235" font-size="13.5" fill="#27272a">Routed to 'retrieve' — needs the corpus.</text>

  <!-- RETRIEVE -->
  <circle cx="86" cy="278" r="5" fill="#d4a44a"/>
  <rect x="104" y="266" width="86" height="22" rx="6" fill="#f3eddf"/>
  <text x="113" y="281" font-size="11" font-weight="700" fill="#8a6d2f">RETRIEVE</text>
  <text x="202" y="281" font-size="13.5" fill="#27272a">Top-5 passages · self-rag.md (0.80), self-rag.md (0.72)…</text>

  <!-- GRADE -->
  <circle cx="86" cy="324" r="5" fill="#d4a44a"/>
  <rect x="104" y="312" width="62" height="22" rx="6" fill="#f3eddf"/>
  <text x="113" y="327" font-size="11" font-weight="700" fill="#8a6d2f">GRADE</text>
  <text x="178" y="327" font-size="13.5" fill="#27272a">3/5 relevant — sufficient to answer.</text>

  <!-- GENERATE -->
  <circle cx="86" cy="370" r="5" fill="#d4a44a"/>
  <rect x="104" y="358" width="84" height="22" rx="6" fill="#f3eddf"/>
  <text x="113" y="373" font-size="11" font-weight="700" fill="#8a6d2f">GENERATE</text>
  <text x="200" y="373" font-size="13.5" fill="#27272a">Drafted a grounded answer using 3 passages.</text>

  <!-- CRITIQUE -->
  <circle cx="86" cy="416" r="5" fill="#2f9e57"/>
  <rect x="104" y="404" width="80" height="22" rx="6" fill="#e6f4ec"/>
  <text x="113" y="419" font-size="11" font-weight="700" fill="#2f7a47">CRITIQUE</text>
  <text x="196" y="419" font-size="13.5" fill="#27272a">Self-critique passed — grounded=true, score=0.92.</text>

  <!-- answer card -->
  <rect x="72" y="456" width="796" height="118" rx="12" fill="#fbfaf7" stroke="#efe9dc" stroke-width="1"/>
  <text x="92" y="484" font-size="13.5" fill="#27272a">Reflection tokens are special tokens Self-RAG emits inline to make retrieval adaptive. A</text>
  <text x="92" y="506" font-size="13.5" fill="#27272a"><tspan>Retrieve</tspan> token decides whether to fetch passages; <tspan>IsRelevant</tspan> judges each passage; <tspan>IsSupported</tspan></text>
  <text x="92" y="528" font-size="13.5" fill="#27272a">checks that claims are grounded; and <tspan>IsUseful</tspan> scores the response.</text>
  <text x="92" y="556" font-size="12.5" fill="#8a6d2f" font-weight="600">Sources:&#160;<tspan fill="#3f3f46">self-rag.md</tspan></text>
  <text x="700" y="556" font-size="11.5" fill="#9ca3af">2.3s · 1.6k tokens · ≈ $0.004</text>

  <!-- footer caption -->
  <text x="72" y="606" font-size="11.5" fill="#b3b3b8">UI preview · the reasoning timeline and sources are real pipeline output; answer text shown for illustration.</text>
</svg>
